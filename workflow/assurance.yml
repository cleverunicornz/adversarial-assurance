# Mount Contract v1 reference witness workflow.
# Copy the rendered mount-owned template into the consumer workflow location.
# Repository rules require the single `assurance-witness` job before merge.
name: assurance

on:
  pull_request:
  merge_group:
  push:

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance_witness:
    name: assurance-witness
    runs-on: __ASSURANCE_WITNESS_RUNNER__
    env:
      CARGO_TERM_COLOR: always
      EXPECTED_WITNESS_RUNNER: __ASSURANCE_WITNESS_RUNNER__
    steps:
      - name: Reject untrusted fork execution
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork pull requests cannot enter the configured witness runner." >&2
          exit 1

      - name: Check out target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve independent checker pins
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          init = YAML.safe_load(
            File.read("situation/assurance/assurance-init.yaml"),
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )
          lock = YAML.safe_load(
            File.read("seed/substrate-lock.yaml"),
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )
          abort "assurance bindings are not CONFIGURED" unless init["status"] == "CONFIGURED"
          abort "wrong substrate contract" unless init.dig("substrate", "contract") == "bedrock-expansion-mount/v1"
          abort "substrate lock does not support mount contract v1" unless lock.fetch("mount_contract_versions").include?(1)

          values = {
            "BEDROCK_REPOSITORY" => lock.dig("checker", "repository"),
            "BEDROCK_REF" => lock.dig("checker", "ref"),
            "BEDROCK_PACKAGE" => lock.dig("checker", "package"),
            "BEDROCK_BINARY" => lock.dig("checker", "binary"),
            "ASSURANCE_REPOSITORY" => init.dig("pack", "repository"),
            "ASSURANCE_REF" => init.dig("pack", "ref")
          }
          repository = /\A[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+\z/
          token = /\A[A-Za-z0-9_.-]+\z/
          sha = /\A[0-9a-f]{40}\z/
          abort "invalid bedrock repository" unless values["BEDROCK_REPOSITORY"]&.match?(repository)
          abort "invalid assurance repository" unless values["ASSURANCE_REPOSITORY"]&.match?(repository)
          abort "invalid bedrock ref" unless values["BEDROCK_REF"]&.match?(sha)
          abort "invalid assurance ref" unless values["ASSURANCE_REF"]&.match?(sha)
          abort "invalid bedrock package" unless values["BEDROCK_PACKAGE"]&.match?(token)
          abort "invalid bedrock binary" unless values["BEDROCK_BINARY"]&.match?(token)

          runner = init.dig("variables", "witness_runner")
          abort "workflow runner differs from init binding" unless runner == ENV.fetch("EXPECTED_WITNESS_RUNNER")
          abort "runner is not substrate-approved" unless lock.fetch("runner_labels").include?(runner)

          File.open(ENV.fetch("GITHUB_ENV"), "a") do |output|
            values.each { |name, value| output.puts "#{name}=#{value}" }
          end
          RUBY

      - name: Fetch and build independently pinned tools outside checkout
        shell: bash
        run: |
          BEDROCK_SOURCE="$RUNNER_TEMP/bedrock-source"
          ASSURANCE_SOURCE="$RUNNER_TEMP/assurance-source"
          rm -rf "$BEDROCK_SOURCE" "$ASSURANCE_SOURCE"

          git init -q "$BEDROCK_SOURCE"
          git -C "$BEDROCK_SOURCE" remote add origin "https://github.com/${BEDROCK_REPOSITORY}.git"
          git -C "$BEDROCK_SOURCE" fetch -q --depth=1 origin "$BEDROCK_REF"
          git -C "$BEDROCK_SOURCE" checkout -q --detach FETCH_HEAD

          git init -q "$ASSURANCE_SOURCE"
          git -C "$ASSURANCE_SOURCE" remote add origin "https://github.com/${ASSURANCE_REPOSITORY}.git"
          git -C "$ASSURANCE_SOURCE" fetch -q --depth=1 origin "$ASSURANCE_REF"
          git -C "$ASSURANCE_SOURCE" checkout -q --detach FETCH_HEAD

          cargo build --locked --release \
            --manifest-path "$BEDROCK_SOURCE/Cargo.toml" \
            --package "$BEDROCK_PACKAGE" \
            --target-dir "$RUNNER_TEMP/bedrock-target"
          cargo build --locked --release \
            --manifest-path "$ASSURANCE_SOURCE/assurance/Cargo.toml" \
            --package assurance \
            --target-dir "$RUNNER_TEMP/assurance-target"

          {
            echo "BEDROCK_TOOL=$RUNNER_TEMP/bedrock-target/release/$BEDROCK_BINARY"
            echo "ASSURANCE_TOOL=$RUNNER_TEMP/assurance-target/release/assurance"
          } >> "$GITHUB_ENV"

      - name: Check bedrock substrate and mount boundary
        run: |
          "$BEDROCK_TOOL" check "$GITHUB_WORKSPACE"

      - name: Check assurance mount
        run: |
          "$ASSURANCE_TOOL" check "$GITHUB_WORKSPACE"

      - name: Build deterministic assurance graphs and manifest
        run: |
          "$ASSURANCE_TOOL" build "$GITHUB_WORKSPACE"

      - name: Require committed assurance generated output
        shell: bash
        run: |
          test -z "$(git status --porcelain -- \
            situation/assurance/graph-manifest.yaml \
            'situation/assurance/runs/*/graph.trig')" || {
            echo "assurance build changed committed graph or manifest bytes" >&2
            git status --short -- situation/assurance
            exit 1
          }

      - name: Require current bedrock generated output
        shell: bash
        run: |
          test -z "$(git status --porcelain -- \
            AGENTS.md situation/graph.trig 'situation/plan/*.trig')" || {
            echo "bedrock generated output is not committed and current" >&2
            git status --short -- AGENTS.md situation/graph.trig situation/plan
            exit 1
          }
