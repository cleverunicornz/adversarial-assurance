# Closed vocabulary. New variables, nouns, verbs, fields, lanes, or
# dispositions require a versioned schema and checker change; adoptions may not extend it.
version: 3
record_schema_version: 1
context: "urn:assurance:context/v1"
base: "urn:assurance:"

variable_syntax: "{{variable}}"
variables:
  - lead_model
  - executor_model
  - validator_model
  - harness
  - witness_runner
  - reviewer_seat
  - final_validator_seat

nouns:
  Promise:
    iri: "urn:assurance:ontology/Promise"
    meaning: "A commitment whose polarity and envelope make it judgeable."
  Witness:
    iri: "urn:assurance:ontology/Witness"
    meaning: "A digest-bound retained observation; it proves existence only."
  Oracle:
    iri: "urn:assurance:ontology/Oracle"
    meaning: "The authority that evaluates a promise against its witnesses."
  Run:
    iri: "urn:assurance:ontology/Run"
    meaning: "One expressly commissioned unit containing the semantic triad."

verbs:
  witnessed_by:
    iri: "urn:assurance:witnessed-by"
    domain: [Promise]
    range: [Witness]
  judged_by:
    iri: "urn:assurance:judged-by"
    domain: [Promise]
    range: [Oracle]
  resolves_to:
    iri: "urn:assurance:resolves-to"
    domain: [Promise, Witness, Oracle, Run]
    range: [Path]
  part_of:
    iri: "urn:assurance:part-of"
    domain: [Promise, Witness, Oracle]
    range: [Run]
  succeeded_by:
    iri: "urn:assurance:succeeded-by"
    domain: [Promise, Witness, Oracle, Run]
    range: [SameNoun]
    meaning: "Append-only chronology only; never authority to commission work."

fields:
  schema_version:
    iri: "urn:assurance:schema-version"
  sequence:
    iri: "urn:assurance:sequence"
  label:
    iri: "urn:assurance:label"
  body:
    iri: "urn:assurance:body"
    projection: "Omitted from TriG; replaced by resolves_to source path plus content_digest."
  polarity:
    iri: "urn:assurance:polarity"
  envelope:
    iri: "urn:assurance:envelope"
  artifact_sha256:
    iri: "urn:assurance:artifact-sha256"
  content_digest:
    iri: "urn:assurance:content-digest"
    generated: true
  producer:
    iri: "urn:assurance:producer"
  ci_run:
    iri: "urn:assurance:ci-run"
  actor:
    iri: "urn:assurance:actor"
  disposition:
    iri: "urn:assurance:disposition"
  lane:
    iri: "urn:assurance:lane"
  state:
    iri: "urn:assurance:state"
  human_invoked:
    iri: "urn:assurance:human-invoked"

polarities: [ELICIT, EXCLUDE]
dispositions: [PASS, FAIL, BLOCKED]
run_states: [OPEN, CLOSED]

# Reserved for future expansions; this pack exercises lane 7000 only.
lanes:
  "1000": research
  "2000": spike
  "3000": contract
  "4000": proof
  "5000": skill-validation
  "6000": document
  "7000": adversarial-review

# These are admissible chronology edges, not automatic commissions. Lanes
# 5000 and 6000 remain independently commissioned; lane 7000 is human-invoked.
admission_edges:
  - ["1000", "2000"]
  - ["1000", "6000"]
  - ["2000", "3000"]
  - ["2000", "6000"]
  - ["6000", "3000"]
  - ["3000", "4000"]
independent_lanes: ["5000", "6000"]
human_invoked_lanes: ["7000"]
